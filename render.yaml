# Render Blueprint provisioning the backend and frontend.
# Assumes the Postgres database already exists with the name 'vasooli-db'.
services:
  - type: web
    name: vasooli-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vasooli-db # This must match the name of your existing Render database
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: RBI_BANK_RATE
        value: "6.5"
      - key: FRONTEND_URL
        value: https://vasooli-frontend-oizq.onrender.com
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_INTAKE_AGENT_ID
        sync: false
      - key: ELEVENLABS_OUTBOUND_AGENT_ID
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: DODO_API_KEY
        sync: false
      - key: BREETH_API_KEY
        sync: false
      - key: BREETH_MCP_URL
        value: https://mcp.thebreeth.com/mcp
  - type: web
    name: vasooli-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: starter # n8n needs at least 512MB RAM; the free plan OOMs, and only paid plans support the persistent disk below
    region: singapore
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n # n8n's own SQLite store (workflows, credentials, execution logs) - without this disk, every redeploy wipes it
      sizeGB: 1
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true" # without this the editor (and every credential stored in it) sits on a public URL with no login
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: WEBHOOK_URL
        value: https://vasooli-n8n.onrender.com # placeholder - Render appends a random suffix to the real hostname; update this to match once assigned, then redeploy
      - key: BACKEND_API_URL
        value: https://vasooli-backend-eqq2.onrender.com
      - key: BREETH_MCP_URL
        value: https://mcp.thebreeth.com/mcp
      - key: ELEVENLABS_OUTBOUND_AGENT_ID
        sync: false
      - key: ELEVENLABS_OUTBOUND_PHONE_NUMBER_ID
        sync: false
  - type: web
    name: vasooli-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vasooli-backend-eqq2.onrender.com
